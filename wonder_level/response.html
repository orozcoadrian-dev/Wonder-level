<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Catálogo de Videojuegos | Wonder Level</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/Css/styles.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2" href="/videojuegos">
                 <img src="/Img/wonder_level_icon.png" height="40" alt="Logo de Wonder Level">
                <span>Wonder Level</span>
            </a>
            <form class="d-flex ms-auto" method="get" action="/videojuegos" role="search">
                <input class="form-control me-2" type="search" name="buscar"
                       value="" placeholder="Buscar videojuego..." aria-label="Buscar videojuego">
                <button class="btn btn-wonder" type="submit">Buscar</button>
            </form>
        </div>
    </nav>

    <header class="catalog-hero d-flex align-items-center">
        <div class="container py-5">
            <h1 class="display-5 fw-bold mb-0">Catálogo de Videojuegos</h1>
        </div>
    </header>

    <main class="container py-5">
        

        <div class="empty-message text-center py-5">
            <h2 class="h4">No se encontraron videojuegos</h2>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
