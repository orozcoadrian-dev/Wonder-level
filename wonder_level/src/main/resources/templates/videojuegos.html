<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Catálogo de Videojuegos | Wonder Level</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/Css/styles.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2" href="/videojuegos">
                 <img src="/Img/wonder_level_icon.png" height="40" alt="Logo de Wonder Level">
                <span>Wonder Level</span>
            </a>
            <form class="d-flex ms-auto" method="get" action="/videojuegos" role="search">
                <input class="form-control me-2" type="search" name="buscar"
                       th:value="${buscar}" placeholder="Buscar videojuego..." aria-label="Buscar videojuego">
                <button class="btn btn-wonder" type="submit">Buscar</button>
            </form>
        </div>
    </nav>

    <header class="catalog-hero d-flex align-items-center">
        <div class="container py-5">
            <h1 class="display-5 fw-bold mb-0">Catálogo de Videojuegos</h1>
        </div>
    </header>

    <main class="container py-5">
        <div class="row g-4" th:if="${videojuegos != null and !videojuegos.isEmpty()}">
            <div class="col-12 col-sm-6 col-md-4 col-lg-3" th:each="juego : ${videojuegos}">
                <article class="card catalog-card h-100">
                    <img class="card-img-top" th:src="${juego.urlImagen}" th:alt="${juego.titulo}">
                    <div class="card-body d-flex flex-column">
                        <h2 class="card-title h5" th:text="${juego.titulo}">Título del videojuego</h2>
                        <p class="card-text flex-grow-1" th:text="${juego.descripcion}">Descripción del videojuego</p>
                        <p class="price mb-0" th:text="${'$' + juego.precio}">$0.00</p>
                    </div>
                </article>
            </div>
        </div>

        <div class="empty-message text-center py-5" th:if="${videojuegos == null or videojuegos.isEmpty()}">
            <h2 class="h4">No se encontraron videojuegos</h2>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
